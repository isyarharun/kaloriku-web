<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman tidak ditemukan — KaloriKu</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/logo-32.png" sizes="32x32">
<link rel="stylesheet" href="/css/style.css">
<style>
  .notfound { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px; }
  .notfound img { width: 88px; height: 88px; margin: 0 auto 24px; display: block; }
  .notfound h1 { font-size: clamp(2rem, 6vw, 3rem); }
  .notfound p { color: var(--body); margin: 14px 0 28px; }
  .notfound .cta-row { justify-content: center; }
</style>
</head>
<body>
  <main class="notfound">
    <img src="/assets/img/logo-180.webp" alt="" width="88" height="88">
    <h1>Halaman tidak ditemukan</h1>
    <p>Alamat ini tidak ada. Mungkin salah ketik, atau halamannya sudah dipindah.</p>
    <div class="cta-row">
      <a class="btn btn-primary" href="/">Kembali ke beranda</a>
      <a class="btn btn-ghost" href="/en/">English version</a>
    </div>
  </main>
</body>
</html>
